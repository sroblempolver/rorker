</head><body><p>Loading Rorker…</p>
<script>
// This page never changes. It always fetches the newest app, skipping the browser cache, so an update
// shows on a normal reload instead of needing a hard refresh.
fetch("app.html?v=" + Date.now(), { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function () { location.replace("app.html"); });
</script>
