[project]
name = "rorker-agent"
version = "0.1.0"
description = "Plan-reading agent: AutoCAD, PDF and photos to a structured building plan"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3,<3",
  "ezdxf>=1.4,<2",
  "shapely>=2.0,<3",
  "pymupdf>=1.24",
  "matplotlib>=3.8",
  "pillow>=10",
  "pydantic>=2.6,<3",
  "supabase>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["rorker_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
